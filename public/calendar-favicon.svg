<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#0f2a5e"/>

  <!-- Calendar body -->
  <rect x="10" y="18" width="44" height="36" rx="6" fill="#ffffff"/>

  <!-- Calendar header bar -->
  <rect x="10" y="18" width="44" height="14" rx="6" fill="#2255b0"/>
  <rect x="10" y="25" width="44" height="7" fill="#2255b0"/>

  <!-- Ring pins -->
  <rect x="21" y="13" width="5" height="10" rx="2.5" fill="#38bdf8"/>
  <rect x="38" y="13" width="5" height="10" rx="2.5" fill="#38bdf8"/>

  <!-- Calendar grid dots — colored cells -->
  <!-- Row 1 -->
  <rect x="14" y="37" width="7" height="6" rx="2" fill="#60a5fa"/>
  <rect x="24" y="37" width="7" height="6" rx="2" fill="#818cf8"/>
  <rect x="34" y="37" width="7" height="6" rx="2" fill="#34d399"/>
  <rect x="44" y="37" width="6" height="6" rx="2" fill="#f472b6"/>

  <!-- Row 2 -->
  <rect x="14" y="46" width="7" height="6" rx="2" fill="#fbbf24"/>
  <rect x="24" y="46" width="7" height="6" rx="2" fill="#38bdf8"/>
  <!-- Today highlight -->
  <rect x="34" y="46" width="7" height="6" rx="2" fill="#2255b0"/>
  <text x="37.5" y="51.5" font-size="5" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="Arial,sans-serif">✓</text>
  <rect x="44" y="46" width="6" height="6" rx="2" fill="#a78bfa"/>
</svg>
